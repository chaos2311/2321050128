<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bài 12</title>
</head>
<style>
    body {
        transition: background-color 0.3s, color 0.3s;
        justify-content: center;
        text-align: center;
        margin-top: 40px;
        background-color: rgb(244, 252, 194);
    }

    h1,
    h2 {
        color: brown;
        transition: color 0.3s;
    }

    img {
        width: 300px;
        height: 300px;
        transition: filter 0.3s;
    }

    body.dark-mode h1,
    body.dark-mode h2 {
        color: aquamarine;
    }

    body.dark-mode {
        background-color: #333;
    }

    body.dark-mode img {
        filter: invert(100%);
    }
</style>

<body>

    <h1>Light Mode</h1>
    <div>
        <div class="all">
            <h2> Ví dụ về đổi chế độ (event)</h2>
            <img src="download (1).jpg" alt="">
        </div>
        <h2>Đổi chế độ</h2>
        <div class="cuoi">
            <button onclick="changeMode()">Change Mode</button>
        </div>
    </div>
   <script>
    document.writeln("Chế độ mặc định: Light");
    let modeNow = "light";

    alert("Chế độ hiện tại: " + modeNow);

    function changeMode() {
      let body = document.getElementsByTagName('body')[0];
      let h1 = document.getElementsByTagName('h1')[0];
      let h2_1 = document.getElementsByTagName('h2')[0];
      let h2_2 = document.getElementsByTagName('h2')[1];
      let img = document.getElementsByTagName('img')[0];

      if (modeNow == "light") {
        body.style.backgroundColor = "black";
        h1.style.color = "aquamarine";
        h2_1.style.color = "white";
        h2_2.innerHTML = "Dark Mode";
        img.src = "color.jpg"; // ảnh dark mode
        modeNow = "dark"; // cập nhật trạng thái
      } else {
        body.style.backgroundColor = "white";
        h1.style.color = "brown";
        h2_1.style.color = "brown";
        h2_2.innerHTML = "Light Mode";
        img.src = "download (1).jpg"; // ảnh sáng lại
        modeNow = "light"; // cập nhật trạng thái
      }
    }
        // function changeMode() {
        //     let body = document.body;
        //     let h1 = document.querySelector('h1');

        //     body.classList.toggle('dark-mode');

        //     if (body.classList.contains('dark-mode')) {
        //         h1.innerHTML = "Dark Mode";
        //     } else {
        //         h1.innerHTML = "Light Mode";
        //     }
        // }

    </script>

</body>

</html>
